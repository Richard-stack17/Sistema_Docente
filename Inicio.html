<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login UNAC</title>
  <link href="./src/output.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('https://i.ytimg.com/vi/dbpYEMGU-MY/maxresdefault.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .content {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 40px;
      height: 100%;
    }

    .login-box {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      width: 384px;
    }

    .login-box img {
      width: 70px;
      display: block;
      margin: 0 auto 10px auto;
    }

    .login-box h2 {
      text-align: center;
      color: #003366;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .form-group {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .form-group label {
      flex: 0 0 40%;
      font-weight: bold;
      color: #003366;
      font-size: 13px;
    }

    .form-group input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      background-color: #003366;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-box button:hover {
      background-color: #002244;
    }

    @media (max-width: 500px) {
      .login-box {
        width: 90%;
      }

      .form-group {
        flex-direction: column;
        align-items: flex-start;
      }

      .form-group label {
        margin-bottom: 5px;
        flex: none;
      }

      .form-group input {
        width: 100%;
      }

      .content {
        padding-top: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="content">
    <div class="login-box">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/13/Universidad-nacional-del-callao.png"
        alt="Logo UNAC">
      <h2>UNIVERSIDAD NACIONAL DEL CALLAO</h2>

      <div class="form-group">
        <label for="usuario">Nombre de usuario:</label>
        <input type="text" id="usuario" name="usuario">
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena">
      </div>

      <button onclick="verificarLogin()">Acceder</button>
    </div>
  </div>

  <script>
    function verificarLogin() {
      const usuario = document.getElementById('usuario').value;
      const contrasena = document.getElementById('contrasena').value;

      if (usuario === '1915220117' && contrasena === 'ca123456d') {
        window.location.href = './Estudiante/EvaluacionParaEstudiante.html';
      } else if (usuario === '020784' && contrasena === '123456unac') {
        window.location.href = './Docente/Evaluacion.html';
      } else {
        alert('Usuario o contraseña incorrectos');
      }
    }
  </script>

</body>
</html>
