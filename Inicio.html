<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login UNAC</title>
  <link href="./src/output.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('https://i.ytimg.com/vi/dbpYEMGU-MY/maxresdefault.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .content {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 40px;
      height: 100%;
    }

    .login-box {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      width: 384px;
    }

    .login-box img {
      width: 70px;
      display: block;
      margin: 0 auto 10px auto;
    }

    .login-box h2 {
      text-align: center;
      color: #003366;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .form-group {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .form-group label {
      flex: 0 0 40%;
      font-weight: bold;
      color: #003366;
      font-size: 13px;
    }

    .form-group input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      background-color: #003366;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-box button:hover {
      background-color: #002244;
    }

    @media (max-width: 500px) {
      .login-box {
        width: 90%;
      }

      .form-group {
        flex-direction: column;
        align-items: flex-start;
      }

      .form-group label {
        margin-bottom: 5px;
        flex: none;
      }

      .form-group input {
        width: 100%;
      }

      .content {
        padding-top: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="login-box">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/13/Universidad-nacional-del-callao.png"
        alt="Logo UNAC">
      <h2>UNIVERSIDAD NACIONAL DEL CALLAO</h2>

      <div class="form-group">
        <label for="usuario">Nombre de usuario:</label>
        <input type="text" id="usuario" name="usuario">
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena">
      </div>

      <button onclick="verificarLogin()">Acceder</button>
      <button onclick="abrirRegistro()">Registrar nuevo usuario</button>
    </div>
  </div>

  <!-- Modal de Registro -->
  <div id="modalRegistro" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
    <div style="background:#fff; padding:20px 30px; border-radius:8px; width:90%; max-width:400px;">
      <h3 style="text-align:center; color:#003366;">Registro de Usuario</h3>

      <!-- Tipo de usuario -->
      <div style="margin-bottom:15px;">
        <label for="tipoUsuario">Tipo de usuario:</label>
        <select id="tipoUsuario" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
          <option value="">Seleccione tipo</option>
          <option value="estudiante">Estudiante</option>
          <option value="docente">Docente</option>
        </select>
      </div>

      <!-- Código -->
      <div style="margin-bottom:15px;">
        <label for="nuevoUsuario">Código:</label>
        <input type="text" id="nuevoUsuario" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
      </div>

      <!-- Contraseña -->
      <div style="margin-bottom:15px;">
        <label for="nuevaContrasena">Contraseña:</label>
        <input type="password" id="nuevaContrasena" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
      </div>

      <!-- Botones -->
      <button onclick="registrarNuevoUsuario()" style="width:100%; background:#003366; color:white; padding:10px; border:none; border-radius:4px;">Registrar</button>
      <button onclick="cerrarRegistro()" style="width:100%; background:#ccc; color:black; padding:10px; margin-top:10px; border:none; border-radius:4px;">Cancelar</button>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    function abrirRegistro() {
      document.getElementById('modalRegistro').style.display = 'flex';
    }

    function cerrarRegistro() {
      document.getElementById('modalRegistro').style.display = 'none';
    }

    function registrarNuevoUsuario() {
      const tipoUsuario = document.getElementById('tipoUsuario').value;
      const nuevoUsuario = document.getElementById('nuevoUsuario').value.trim();
      const nuevaContrasena = document.getElementById('nuevaContrasena').value.trim();

      if (!tipoUsuario) {
        alert('Seleccione el tipo de usuario');
        return;
      }

      if (!/^\d+$/.test(nuevoUsuario)) {
        alert('El código debe contener solo números');
        return;
      }

      if (tipoUsuario === 'estudiante' && nuevoUsuario.length !== 10) {
        alert('El código de estudiante debe tener 10 dígitos');
        return;
      }

      if (tipoUsuario === 'docente' && nuevoUsuario.length !== 6) {
        alert('El código de docente debe tener 6 dígitos');
        return;
      }

      if (nuevaContrasena.length < 6) {
        alert('La contraseña debe tener al menos 6 caracteres');
        return;
      }

      const usuarios = JSON.parse(localStorage.getItem('usuarios')) || {};
      if (usuarios[nuevoUsuario]) {
        alert('Este usuario ya está registrado');
        return;
      }

      usuarios[nuevoUsuario] = {
        contrasena: nuevaContrasena,
        tipo: tipoUsuario
      };

      localStorage.setItem('usuarios', JSON.stringify(usuarios));
      alert('Usuario registrado exitosamente');
      cerrarRegistro();
    }

    function verificarLogin() {
      const usuario = document.getElementById('usuario').value.trim();
      const contrasena = document.getElementById('contrasena').value.trim();

      // Usuarios predefinidos
      if (usuario === '1915220117' && contrasena === 'ca123456d') {
        window.location.href = './Estudiante/EvaluacionE.html';
        return;
      }

      if (usuario === '020784' && contrasena === '123456unac') {
        window.location.href = './Docente/Evaluacion.html';
        return;
      }

      const usuarios = JSON.parse(localStorage.getItem('usuarios')) || {};
      if (usuarios[usuario] && usuarios[usuario].contrasena === contrasena) {
        if (usuarios[usuario].tipo === 'estudiante') {
          window.location.href = './Estudiante/EvaluacionE.html';
        } else {
          window.location.href = './Docente/Evaluacion.html';
        }
      } else {
        alert('Usuario o contraseña incorrectos');
      }
    }
  </script>
</body>

</html>
